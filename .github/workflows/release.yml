name: Release

# Push a tag like v1.1.0 (matching VERSION) to publish a signed, notarized build.
# To replace the files of a release that already exists (say, one published
# before notarization was set up), run this workflow by hand with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, like v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      # Fail in seconds, not after building, when something isn't set up.
      # Secrets: DEVELOPER_ID_P12 (base64 of the exported .p12), DEVELOPER_ID_P12_PASSWORD,
      # NOTARY_KEY_P8 (base64 of AuthKey_XXXX.p8), NOTARY_KEY_ID, NOTARY_ISSUER.
      # scripts/set-release-secrets.sh uploads them all.
      - name: Secrets are set
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            if [ -z "${!name}" ]; then echo "::error::The $name secret is missing. See README → Releasing."; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the build number is the commit count

      - name: Tag matches VERSION
        run: test "${TAG#v}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Changelog has this version
        run: grep -q "^## \[${TAG#v}\]" CHANGELOG.md

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          # Use exactly this certificate; never fall back to another identity.
          id="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$id" ]; then
            echo "::error::DEVELOPER_ID_P12 has no \"Developer ID Application\" certificate with its private key."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "BARMANAGER_SIGN_ID=$id" >> "$GITHUB_ENV"

      - name: Build signed app
        run: scripts/build.sh

      - name: Notarize & package
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          REQUIRE_NOTARIZATION: "1"
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          scripts/package.sh

      # What a downloader's Mac will check.
      - name: Gatekeeper accepts it
        run: |
          v="${TAG#v}"
          xcrun stapler validate build/BarManager.app
          xcrun stapler validate "dist/BarManager-$v.dmg"
          spctl --assess --type execute --verbose=2 build/BarManager.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/BarManager-$v.dmg"

      - name: Release notes from CHANGELOG
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Already published (by hand, say): swap in the notarized files, keep the notes.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "BarManager ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
